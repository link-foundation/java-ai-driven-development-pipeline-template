# Dependabot proposes the updates that CI reports (issues #14 and #15).
#
# - maven: dependencies and build plugins in pom.xml. Every plugin version is a
#   property, and requireMavenVersion uses a range ([3.10.0,)), so a plugin bump
#   never rewrites an enforcer rule by accident. Keep that layout.
# - github-actions: the action pins in .github/workflows. Pins that Dependabot
#   cannot see (bun-version, OSV_SCANNER_VERSION, the Actionlint image digest,
#   runner images) stay with the weekly freshness warning from
#   scripts/check-ci-dependencies.mjs in workflows.yml.
#
# Minor and patch updates arrive as one grouped pull request per ecosystem;
# majors arrive separately because they need a changelog read. The cooldown
# skips releases younger than a week, so a bad release can be yanked first.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
