name: Security

# Dependency audit (issue #15). Code scanning does not audit dependencies, and an
# advisory can be published against a version that has not changed, so the audit
# also runs weekly on main. Every severity fails: a vulnerable dependency or build
# plugin is something a maintainer must act on. Dependabot (.github/dependabot.yml)
# proposes the version bumps. The audit does not depend on GitHub's dependency
# graph, which is disabled in this repository (actions/dependency-review-action
# needs it).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit Maven dependencies and plugins (OSV)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-audit
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '27.0.1'
          distribution: temurin
          cache: maven

      - name: Install OSV-Scanner
        env:
          # scripts/check-ci-dependencies.mjs keeps this version current and
          # checks the checksum against the release asset digest.
          OSV_SCANNER_VERSION: v2.7.1
          OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/osv-scanner"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o "$RUNNER_TEMP/osv-scanner/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner/osv-scanner"
          echo "$RUNNER_TEMP/osv-scanner" >> "$GITHUB_PATH"

      - name: Audit pom.xml dependency tree (all severities)
        # OSV-Scanner resolves transitive Maven dependencies from pom.xml itself.
        run: osv-scanner scan source -L pom.xml

      - name: Audit Maven build plugins (all severities)
        # OSV-Scanner omits plugin dependencies. Maven resolves the actual test
        # and plugin trees, including release signing, for the supplemental audit.
        # site is not used or declared by this project: resolve-plugins includes
        # this unused super-POM tool even though it is not a jar lifecycle plugin.
        run: |
          node --test experiments/maven-plugin-audit.test.mjs
          ./mvnw dependency:list dependency:resolve-plugins -Prelease -DexcludeArtifactIds=maven-site-plugin -DoutputFile=target/resolved-artifacts.txt -DappendOutput=true -B -ntp
          node scripts/audit-maven-plugins.mjs pom.xml target/resolved-artifacts.txt
